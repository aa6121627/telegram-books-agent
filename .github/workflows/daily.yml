
name: Daily Telegram Books Agent

on:
  schedule:
    # تشغيل يومي الساعة 07:17 بتوقيت القاهرة
    - cron: "17 7 * * *"
      timezone: "Africa/Cairo"
  workflow_dispatch:

concurrency:
  group: telegram-books-agent
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  process-next-book:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      TG_API_ID: ${{ secrets.TG_API_ID }}
      TG_API_HASH: ${{ secrets.TG_API_HASH }}
      TG_SESSION: ${{ secrets.TG_SESSION }}
      TG_CHANNEL: altfwok

      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}

      FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}

      MAX_BOOK_MB: "8000"

    steps:
      # تحميل ملفات المشروع
      - name: Checkout
        uses: actions/checkout@v4

      # إعداد Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # تثبيت المكتبات
      - name: Install dependencies
        run: npm install --omit=dev

      # إعداد بيانات Firebase
      - name: Configure Firebase service account
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "Missing FIREBASE_SERVICE_ACCOUNT_JSON secret"
            exit 1
          fi

          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"

          chmod 600 "$RUNNER_TEMP/firebase-service-account.json"

          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      # تحديد مجلد العمل باستخدام متغير البيئة الصحيح
      - name: Configure work directory
        shell: bash
        run: |
          echo "WORK_DIR=$RUNNER_TEMP/books-work" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/books-work"

      # التحقق من المساحة المتاحة
      - name: Check available temporary disk
        shell: bash
        run: |
          echo "Available disk space:"
          df -h "$RUNNER_TEMP"

          echo "Work directory:"
          echo "$WORK_DIR"

      # تشغيل النظام لمعالجة الكتاب
      - name: Process latest unprocessed book from @altfwok
        shell: bash
        run: npm run run

      # حذف الملفات المؤقتة حتى عند فشل التشغيل
      - name: Clean temporary files
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/books-work"
          rm -f "$RUNNER_TEMP/firebase-service-account.json"
