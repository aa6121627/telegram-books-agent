name: Telegram Books Approval Bot

on:
  repository_dispatch:
    types: [telegram_update]
  workflow_dispatch:

concurrency:
  group: telegram-books-agent
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  process-telegram-update:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      TG_API_ID: ${{ secrets.TG_API_ID }}
      TG_API_HASH: ${{ secrets.TG_API_HASH }}
      TG_SESSION: ${{ secrets.TG_SESSION }}
      TG_CHANNEL: altfwok
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      ADMIN_TELEGRAM_ID: "1263813431"
      TELEGRAM_UPDATE_JSON: ${{ toJSON(github.event.client_payload.update) }}

      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
      FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
      MAX_BOOK_MB: "8000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --omit=dev

      - name: Configure Firebase service account
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "Missing FIREBASE_SERVICE_ACCOUNT_JSON secret"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          chmod 600 "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Configure work directory
        run: |
          echo "WORK_DIR=$RUNNER_TEMP/books-work" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/books-work"

      - name: Process Telegram update
        run: npm run run

      - name: Clean temporary files
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/books-work"
          rm -f "$RUNNER_TEMP/firebase-service-account.json"
